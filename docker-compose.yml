name: fairfame

# Local development infrastructure for Phase 0.
# Credentials here are intentionally weak dev-only defaults and match the
# DATABASE_URL / REDIS_URL in .env.example. Never reuse them outside localhost.

services:
  postgres:
    # pgvector's image rather than plain `postgres`: the locked stack calls for
    # pgvector for embeddings (CLAUDE.md), and the official Postgres images do
    # not ship the extension. This is Postgres 17 with `vector` preinstalled —
    # same major version, so the existing data directory is unaffected.
    image: pgvector/pgvector:pg17
    container_name: fairfame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairfame
      POSTGRES_PASSWORD: fairfame
      POSTGRES_DB: fairfame
      # Deterministic collation so ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --encoding=UTF8"
      # Consumed by the init script below to create the RLS-bound app role.
      APP_DB_USER: "${APP_DB_USER:-fairfame_app}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-fairfame_app}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first init of the volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairfame -d fairfame"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: fairfame-redis
    restart: unless-stopped
    # BullMQ requires keyspace eviction to be disabled: losing a job key to an
    # eviction policy silently drops work.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Dev mail catcher for review-request campaigns (P1b-T1). Nothing leaves the
  # machine: the SMTP transport points here, and every message is readable in
  # the web UI at http://localhost:8025.
  #
  # Mailpit rather than MailHog — MailHog is archived and publishes an
  # amd64-only image, which emulates poorly on Apple Silicon. Mailpit is its
  # maintained successor and speaks the same SMTP(1025)/UI(8025) contract.
  mail:
    image: axllent/mailpit:v1.28
    container_name: fairfame-mail
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Dev inbox: keep it small and self-pruning.
      MP_MAX_MESSAGES: 500
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
