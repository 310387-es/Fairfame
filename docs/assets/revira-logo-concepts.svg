<svg width="1240" height="1040" viewBox="0 0 1240 1040" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <!-- ICON A: speech bubble + rising bars (reviews + insights) -->
    <g id="iconA">
      <rect x="8" y="6" width="80" height="62" rx="18" fill="#3D5AF1"/>
      <path d="M26 60 L26 84 L46 64 Z" fill="#3D5AF1"/>
      <rect x="26" y="42" width="10" height="16" rx="3" fill="#FFFFFF"/>
      <rect x="43" y="34" width="10" height="24" rx="3" fill="#FFFFFF"/>
      <rect x="60" y="24" width="10" height="34" rx="3" fill="#F5A524"/>
    </g>
    <!-- ICON B: monogram tile with notification dot -->
    <g id="iconB">
      <rect x="6" y="6" width="84" height="84" rx="22" fill="#3D5AF1"/>
      <text x="45" y="66" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>
      <circle cx="76" cy="20" r="11" fill="#F5A524" stroke="#FFFFFF" stroke-width="4"/>
    </g>
    <!-- ICON C: spark / quality mark -->
    <g id="iconC">
      <path d="M48 8 L56 40 L88 48 L56 56 L48 88 L40 56 L8 48 L40 40 Z" fill="#3D5AF1"/>
      <path d="M80 14 L83.5 26 L95 30 L83.5 33.5 L80 46 L76.5 33.5 L65 30 L76.5 26 Z" fill="#F5A524"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1240" height="1040" fill="#F6F7FB"/>

  <!-- header -->
  <text x="64" y="70" font-size="30" font-weight="700" fill="#10193A">Revira</text>
  <text x="160" y="70" font-size="30" font-weight="400" fill="#8A90A6">— logo concepts</text>
  <text x="64" y="98" font-size="15" font-weight="400" fill="#8A90A6">Flat vector · two-color system · works as icon, wordmark, and favicon · provisional name</text>
  <line x1="64" y1="120" x2="1176" y2="120" stroke="#E3E6EF" stroke-width="1"/>

  <!-- ================= CONCEPT A ================= -->
  <text x="64" y="168" font-size="16" font-weight="600" fill="#3D5AF1">A</text>
  <text x="86" y="168" font-size="16" font-weight="600" fill="#10193A">Voice &amp; Insight</text>
  <text x="86" y="188" font-size="13" fill="#8A90A6">Speech bubble + rising bars — reviews turned into trends. Our core loop in one mark.</text>

  <!-- icon card -->
  <rect x="64" y="204" width="150" height="150" rx="20" fill="#FFFFFF" stroke="#E3E6EF"/>
  <use href="#iconA" transform="translate(91,231) scale(1.0)"/>
  <!-- light lockup -->
  <use href="#iconA" transform="translate(250,250) scale(0.62)"/>
  <text x="322" y="298" font-size="46" font-weight="600" fill="#10193A" letter-spacing="0.5">Revira</text>
  <!-- dark lockup -->
  <rect x="620" y="204" width="556" height="150" rx="20" fill="#0E1633"/>
  <g transform="translate(662,248) scale(0.62)">
    <rect x="8" y="6" width="80" height="62" rx="18" fill="#5B76F5"/>
    <path d="M26 60 L26 84 L46 64 Z" fill="#5B76F5"/>
    <rect x="26" y="42" width="10" height="16" rx="3" fill="#FFFFFF"/>
    <rect x="43" y="34" width="10" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="60" y="24" width="10" height="34" rx="3" fill="#F5A524"/>
  </g>
  <text x="734" y="292" font-size="42" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Revira</text>
  <text x="960" y="345" font-size="12" fill="#6B7290">dark / reversed</text>

  <!-- ================= CONCEPT B ================= -->
  <text x="64" y="430" font-size="16" font-weight="600" fill="#3D5AF1">B</text>
  <text x="86" y="430" font-size="16" font-weight="600" fill="#10193A">Monogram</text>
  <text x="86" y="450" font-size="13" fill="#8A90A6">Bold R tile with a live-notification dot — instantly a favicon / app icon. Most scalable.</text>

  <rect x="64" y="466" width="150" height="150" rx="20" fill="#FFFFFF" stroke="#E3E6EF"/>
  <use href="#iconB" transform="translate(91,493) scale(1.0)"/>
  <use href="#iconB" transform="translate(250,508) scale(0.66)"/>
  <text x="330" y="562" font-size="46" font-weight="600" fill="#10193A" letter-spacing="0.5">Revira</text>
  <rect x="620" y="466" width="556" height="150" rx="20" fill="#0E1633"/>
  <g transform="translate(664,506) scale(0.62)">
    <rect x="6" y="6" width="84" height="84" rx="22" fill="#5B76F5"/>
    <text x="45" y="66" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>
    <circle cx="76" cy="20" r="11" fill="#F5A524" stroke="#0E1633" stroke-width="4"/>
  </g>
  <text x="734" y="554" font-size="42" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Revira</text>
  <text x="960" y="607" font-size="12" fill="#6B7290">dark / reversed</text>

  <!-- ================= CONCEPT C ================= -->
  <text x="64" y="692" font-size="16" font-weight="600" fill="#3D5AF1">C</text>
  <text x="86" y="692" font-size="16" font-weight="600" fill="#10193A">Spark</text>
  <text x="86" y="712" font-size="13" fill="#8A90A6">A quality spark with an AI accent — signals insight and the &quot;gold-standard&quot; review.</text>

  <rect x="64" y="728" width="150" height="150" rx="20" fill="#FFFFFF" stroke="#E3E6EF"/>
  <use href="#iconC" transform="translate(91,755) scale(1.0)"/>
  <use href="#iconC" transform="translate(252,772) scale(0.64)"/>
  <text x="330" y="824" font-size="46" font-weight="600" fill="#10193A" letter-spacing="0.5">Revira</text>
  <rect x="620" y="728" width="556" height="150" rx="20" fill="#0E1633"/>
  <g transform="translate(662,768) scale(0.62)">
    <path d="M48 8 L56 40 L88 48 L56 56 L48 88 L40 56 L8 48 L40 40 Z" fill="#5B76F5"/>
    <path d="M80 14 L83.5 26 L95 30 L83.5 33.5 L80 46 L76.5 33.5 L65 30 L76.5 26 Z" fill="#F5A524"/>
  </g>
  <text x="734" y="816" font-size="42" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Revira</text>
  <text x="960" y="869" font-size="12" fill="#6B7290">dark / reversed</text>

  <!-- palette footer -->
  <line x1="64" y1="918" x2="1176" y2="918" stroke="#E3E6EF" stroke-width="1"/>
  <text x="64" y="954" font-size="14" font-weight="600" fill="#10193A">Palette</text>
  <rect x="150" y="940" width="26" height="26" rx="6" fill="#3D5AF1"/>
  <text x="186" y="958" font-size="13" fill="#6B7290">Indigo #3D5AF1 · trust</text>
  <rect x="392" y="940" width="26" height="26" rx="6" fill="#F5A524"/>
  <text x="428" y="958" font-size="13" fill="#6B7290">Amber #F5A524 · rating / energy</text>
  <rect x="700" y="940" width="26" height="26" rx="6" fill="#10193A"/>
  <text x="736" y="958" font-size="13" fill="#6B7290">Ink #10193A · text</text>
  <text x="64" y="1004" font-size="12" fill="#A2A7B8">Concept sheet · wordmark shown in Poppins for preview — final build should use a licensed typeface converted to outlines. Verify name/domain/trademark before commit.</text>
</svg>
