name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres and Redis. The database suites are the only proof that RLS
    # actually isolates tenants, so they must run on every change — never be
    # skipped when a service is missing. A skipped isolation test that reports
    # green is worse than no test at all.
    services:
      postgres:
        # pgvector's image, matching docker-compose. The official Postgres
        # images do not ship the extension, so `CREATE EXTENSION vector` in
        # migration 0008 fails on them — and it is the first thing that runs.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fairfame
          POSTGRES_PASSWORD: fairfame
          POSTGRES_DB: fairfame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairfame -d fairfame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:8-alpine
        # BullMQ requires noeviction: any eviction policy can silently drop job keys.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fairfame:fairfame@localhost:5432/fairfame
      APP_DATABASE_URL: postgres://fairfame_app:fairfame_app@localhost:5432/fairfame
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real-000000
      BETTER_AUTH_URL: http://localhost:3000
      LOG_LEVEL: warn
      LOG_PRETTY: "false"
      # The browser suite connects the mock source, which is a development
      # instrument and hidden unless a deployment opts in. `next start` runs in
      # production mode here, so without this the suite cannot set an account
      # up — see ALLOW_DEV_CONNECTORS in src/lib/env.ts.
      ALLOW_DEV_CONNECTORS: "true"
      # tests/db/channels.test.ts sets its own, but the app's own boot path
      # wants one too, and a fixed value is fine for a throwaway database.
      TOKEN_VAULT_KEYS: "ci0:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compose init script cannot run against a GitHub service container,
      # so create the RLS-bound role here. It must be NOSUPERUSER/NOBYPASSRLS
      # or every isolation test would pass for the wrong reason.
      - name: Create the application role
        env:
          PGPASSWORD: fairfame
        run: |
          psql -h localhost -U fairfame -d fairfame -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'fairfame_app') THEN
              CREATE ROLE fairfame_app LOGIN PASSWORD 'fairfame_app';
            END IF;
          END
          $$;
          ALTER ROLE fairfame_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE fairfame TO fairfame_app;
          SQL

      - name: Write .env for the db-backed suites
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "APP_DATABASE_URL=$APP_DATABASE_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            echo "NODE_ENV=test"
            echo "LOG_LEVEL=warn"
            echo "LOG_PRETTY=false"
            echo "ALLOW_DEV_CONNECTORS=$ALLOW_DEV_CONNECTORS"
            echo "TOKEN_VAULT_KEYS=$TOKEN_VAULT_KEYS"
          } > .env

      - run: pnpm run db:migrate
      - run: pnpm run db:seed

      # Fail loudly if the runtime role can bypass RLS — that would make the
      # tenant isolation suite meaningless while still reporting green.
      - name: Assert the runtime role cannot bypass RLS
        env:
          PGPASSWORD: fairfame
        run: |
          RESULT=$(psql -h localhost -U fairfame -d fairfame -tAc \
            "select rolsuper or rolbypassrls from pg_roles where rolname = 'fairfame_app'")
          if [ "$RESULT" != "f" ]; then
            echo "fairfame_app can bypass RLS — isolation tests would be worthless." >&2
            exit 1
          fi

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check

      # Every locale must define the same keys, and every key must be used.
      # A message missing from one language throws at render, so without this
      # the untested language breaks in front of a customer.
      - run: pnpm run check:i18n

      # Unused files and dependencies. Unused *exports* are reported by
      # `pnpm knip:all` but not gated — see docs/16-code-hygiene.md.
      - run: pnpm run knip

      - run: pnpm run test
      - run: pnpm run test:db
      - run: pnpm run build

      # Browser tests. They are outside `pnpm verify` because they need a live
      # server and database — but CI has both, and leaving them out meant the
      # mobile-layout and keyboard/focus coverage only ran when somebody
      # remembered to. That is precisely the rot those tests exist to catch.
      #
      # Chromium only: these assert on layout at 390px and on focus order, and
      # neither is a place where engines differ enough to pay for three of them.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts `pnpm start` itself (see playwright.config.ts) — the
      # bundle just built, not a dev server, so no route compiles on first hit.
      - name: Browser tests
        run: pnpm run test:e2e

      # Traces and screenshots are kept only for failures, so this uploads
      # nothing on a green run.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
